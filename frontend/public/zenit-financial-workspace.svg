<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">ZENIT financial trading workspace</title>
<desc id="desc">A premium dark financial workspace with a laptop, multi-monitor market charts, candlesticks, and subtle stablecoin imagery. No people are shown.</desc>
<defs>
  <linearGradient id="room" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset=".48" stop-color="#14263b"/><stop offset="1" stop-color="#05090f"/></linearGradient>
  <linearGradient id="window" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#173450"/><stop offset=".55" stop-color="#091522"/><stop offset="1" stop-color="#20394d"/></linearGradient>
  <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#596b7c"/><stop offset=".25" stop-color="#1b2b3a"/><stop offset="1" stop-color="#070c12"/></linearGradient>
  <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#263748"/><stop offset=".2" stop-color="#111c29"/><stop offset="1" stop-color="#05080d"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff0ad"/><stop offset=".45" stop-color="#d8b45b"/><stop offset="1" stop-color="#806026"/></linearGradient>
  <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#0c1e2e"/><stop offset="1" stop-color="#06101b"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#b68d37" stop-opacity=".24"/><stop offset="1" stop-color="#b68d37" stop-opacity="0"/></radialGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feGaussianBlur stdDeviation="22"/></filter>
  <pattern id="grid" width="58" height="46" patternUnits="userSpaceOnUse"><path d="M58 0H0V46" fill="none" stroke="#7395b2" stroke-opacity=".14" stroke-width="1"/></pattern>
  <pattern id="keys" width="20" height="13" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="15" height="8" rx="2" fill="#7b8a97" fill-opacity=".35"/></pattern>
</defs>
<rect width="1600" height="1000" fill="url(#room)"/>
<ellipse cx="890" cy="360" rx="650" ry="440" fill="url(#glow)"/>
