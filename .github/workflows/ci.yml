name: Zenit CI
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: zenit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d zenit_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      JWT_SECRET: ci-test-jwt-secret-change-me-1234567890
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/zenit_test
      APP_ORIGIN: http://localhost:5173
      API_PUBLIC_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:5173
      CHAIN_ID: 56
      PRIMARY_ASSET: USDT
      PAYMENT_CONFIRMATIONS: 1
      SESSION_TTL_MINUTES: 60
      NONCE_TTL_MINUTES: 5
      PIN_CHALLENGE_TTL_MINUTES: 5
      WEBAUTHN_CHALLENGE_TTL_MINUTES: 5
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - name: Prepare Supabase-compatible roles
        working-directory: .
        run: |
          PGPASSWORD=ci psql -h 127.0.0.1 -U ci -d zenit_test -v ON_ERROR_STOP=1 -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname='anon') THEN CREATE ROLE anon NOLOGIN; END IF; IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname='authenticated') THEN CREATE ROLE authenticated NOLOGIN; END IF; END \$\$;"
      - name: Apply database migrations
        working-directory: .
        run: |
          for file in supabase/migrations/*.sql; do
            echo "Applying $file"
            PGPASSWORD=ci psql -h 127.0.0.1 -U ci -d zenit_test -v ON_ERROR_STOP=1 -f "$file"
          done
      - run: npm test
      - name: Run integration tests
        run: |
          set -o pipefail
          npm run test:integration 2>&1 | tee /tmp/integration.log
          if grep -Eq '[0-9]+ skipped' /tmp/integration.log; then
            echo "Integration suite contains skipped tests; configure TEST_* CI credentials before accepting this gate."
            exit 1
          fi
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm run test:login
